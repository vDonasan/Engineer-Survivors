<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="es-loading">
      <div class="es-bg"></div>
      <div id="es-loot"></div>
      <div class="es-center">
        <div class="es-badge">TURNO DA MADRUGADA · LAB. DE PESQUISA</div>
        <div class="es-title" data-text="ENGINEERING SURVIVORS">ENGINEERING SURVIVORS</div>
        <div class="es-battery"><div id="es-cells"></div><div class="es-battery-tip"></div></div>
        <div class="es-readout"><span id="es-pct">0</span><span class="es-pct-sign">%</span></div>
        <div id="es-status"><span id="es-tip">Ligando os equipamentos do laboratório</span><span class="es-cursor">_</span></div>
      </div>
      <div id="es-parade"></div>
      <div class="es-hint"><b>WASD</b> mover · <b>Espaço</b> especial · <b>1 2 3</b> escolher carta · <b>Esc</b> menu</div>
      <div class="es-crt"></div>
    </div>
    <div id="es-error" hidden>
      <div class="es-title">Não foi possível iniciar o jogo</div>
      <div id="es-error-text"></div>
      <button id="es-reload" type="button">Recarregar a página</button>
    </div>
    <div id="es-banner"></div>
    <script src="loader-ui.js"></script>
    <script>
      ESLoader.start("Build/{{{ LOADER_FILENAME }}}", {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        autoSyncPersistentDataPath: true,
      });
    </script>
  </body>
</html>
